name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 38-new-patches
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            commit_count="$(git rev-list --count HEAD)"
            echo "VITE_APP_VERSION=1.0.${commit_count}" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_VERSION=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Build application
        env:
          VITE_PATCH_API_URL: ${{ secrets.VITE_PATCH_API_URL }}
          VITE_RULES_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Ensure rules file is published
        run: cp public/ples-iop-rules.json dist/ples-iop-rules.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4