name: Build SCL PLES executable

on:
  push:
    paths:
      - 'scripts/update-scl-for-ples.py'
      - 'public/ples-iop-rules.json'
      - '.github/workflows/build-scl-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install lxml pyinstaller

      - name: Build executable
        run: python -m PyInstaller --onefile --name update-scl-for-ples scripts\update-scl-for-ples.py

      - name: Smoke test executable
        run: .\dist\update-scl-for-ples.exe --help

      - name: Prepare release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\update-scl-for-ples.exe release\
          Copy-Item public\ples-iop-rules.json release\

      - name: Upload executable and rules artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-scl-for-ples-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30